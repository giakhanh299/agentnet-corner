    card_subtitle: "10 tiếng một ngày, lương theo giờ"
    spoken: "An làm thuê mười tiếng một ngày. Hết giờ, anh nhận lương theo giờ, về nhà mệt lả, ngủ một giấc, sáng mai lại cày tiếp. Một năm trôi qua, tiền trong túi anh vẫn thế."
