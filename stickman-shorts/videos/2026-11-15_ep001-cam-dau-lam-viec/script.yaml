    card_title: "MỘT NĂM SAU"
    card_subtitle: "Cùng một sức, khác nhau ở cách nghĩ"
    spoken: "Một năm sau, An vẫn đổi giờ lấy tiền. Bình không bán giờ nữa. Cầu của anh làm việc cả khi anh ngủ. Cùng một sức, khác nhau ở cách nghĩ."
    visual: "Ca hai dung canh nhau: An (trai, sad) - Binh (phai, happy) + tui tien; An di bo tai cho, Binh dung yen"
