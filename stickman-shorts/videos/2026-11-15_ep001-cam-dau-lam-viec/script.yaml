    card_subtitle: "5 tiếng làm thuê, 5 tiếng học cách khác"
    spoken: "Bình cũng làm mười tiếng một ngày. Nhưng anh chỉ làm thuê năm tiếng. Năm tiếng còn lại, anh học cách bán hàng, học cách để tiền làm việc. Anh xây một cây cầu. Ai đi qua, anh thu một đồng."
